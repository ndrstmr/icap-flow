LogFile /var/log/clamav/clamd.log
LogTime yes
PidFile /run/clamav/clamd.pid
LocalSocket /run/clamav/clamd.sock
User clamav
Foreground true

# reference: what the engine cannot inspect is a detection, not "OK". Without these two ClamAV answers OK for a
# file over a limit and for an encrypted archive, and the ICAP service answers 204.
AlertExceedsMax yes
AlertEncrypted yes
# reference: small limits, so that the tests can exceed them with small files. Choose your own; AlertExceedsMax stays.
MaxFileSize 2M
MaxScanSize 4M
