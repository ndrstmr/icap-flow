# Reference configuration of the virus_scan service for icap-flow's verified mode (c-icap-modules 0.5.7).
# Differences to the file in mnemoshare/clamav-icap are marked "reference:".

Service antivirus_module virus_scan.so
ServiceAlias srv_clamav virus_scan

# reference: /avscan scans every object, whatever its type (force=on), whatever its size (sizelimit=off), and
# answers a clean object with 204 (allow204=on). Without force=on the service answers 204 or the unchanged
# message for every type that is not listed in ScanFileTypes, exactly as for a clean one.
ServiceAlias avscan virus_scan?allow204=on&sizelimit=off&mode=simple&force=on

# reference: /avscan_typed is the behaviour of the unmodified image (only the types below are scanned). The tests
# use it to show what a verifying client does with answers that mean "not scanned". Do not use it for uploads.
ServiceAlias avscan_typed virus_scan?allow204=on&sizelimit=off&mode=simple

virus_scan.ScanFileTypes TEXT DATA EXECUTABLE ARCHIVE GIF JPEG MSOFFICE
# reference: no data is sent before the verdict, also if the service is called without the mode argument.
virus_scan.SendPercentData 0
virus_scan.MaxObjectSize 5M
# reference: an engine that fails is an ICAP 500, never a pass (this is also the default).
virus_scan.PassOnError off
virus_scan.DefaultEngine clamav
Include clamd_mod.conf
